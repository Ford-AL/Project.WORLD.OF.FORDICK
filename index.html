   function setCookie(name, value, days) {
    const d = new Date();
    d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
    document.cookie = name + "=" + encodeURIComponent(value) + ";expires=" + d.toUTCString() + ";path=/;SameSite=Lax";
}

function getCookie(name) {
    const nameEQ = name + "=";
    const ca = document.cookie.split(';');
    for(let i = 0; i < ca.length; i++) {
        let c = ca[i].trim();
        if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length));
    }
    return null;
}

function checkStreak() {
    const today = new Date();
    today.setHours(0,0,0,0);
    const todayStr = today.toISOString().split('T')[0];
    
    let streak = parseInt(getCookie('streak_count')) || 0;
    let lastVisit = getCookie('streak_last_visit');
    let message = '';
    let isNew = false;
    
    if (!lastVisit) {
        
        streak = 1;
        message = 'Первая дрочка';
        isNew = true;
    } else {
        const lastDate = new Date(lastVisit);
        lastDate.setHours(0,0,0,0);
        const diffDays = Math.round((today - lastDate) / (1000 * 60 * 60 * 24));
        
        if (lastVisit === todayStr) {
            
            streak += 1;
            message = `Кончи больше! ${streak} дрочек сегодня!`;
            isNew = true;
        } else if (diffDays === 1) {
            
            streak += 1;
            message = `дрочек больше! ${streak} дрочки полряддряд `;
            isNew = true;
        } else if (diffDays > 1) {
            
            streak = 1;
            message = 'дрочки сброшены... Начинаем дрочить!';
            isNew = true;
        }
    }
    
    if (isNew) {
        setCookie('streak_count', streak, 365);
        setCookie('streak_last_visit', todayStr, 365);
    }
    
    updateStreakUI(streak, message);
}

function updateStreakUI(streak, message) {
    const badge = document.getElementById('streakBadge');
    const count = document.getElementById('streakCount');
    const popup = document.getElementById('streakPopup');
    
    if (streak > 0) {
        count.textContent = streak;
        badge.style.display = 'flex';
    }
    
    if (message) {
        popup.innerHTML = `<div class="streak-popup">${message}</div>`;
        setTimeout(() => { popup.innerHTML = ''; }, 3000);
    }
}

                    iframe.allowFullscreen = true;
                    iframe.style.pointerEvents = 'none';
                    thumb.appendChild(iframe);
                } else {
                    const videoEl = document.createElement('video');
                    videoEl.muted = true;
                    videoEl.preload = 'metadata';
                    videoEl.setAttribute('playsinline', '');
                    
                    const source = document.createElement('source');
                    source.src = video.url;
                    source.type = 'video/mp4';
                    videoEl.appendChild(source);
                    
                    videoEl.addEventListener('loadeddata', function() {
                        this.currentTime = 0.1;
                    });
                    
                    videoEl.addEventListener('error', function() {
                        this.style.display = 'none';
                        const placeholder = document.createElement('div');
                        placeholder.className = 'thumb-placeholder';
                        thumb.appendChild(placeholder);
                    });
                    
                    thumb.appendChild(videoEl);
                }
                
                const icon = document.createElement('div');
                icon.className = 'play-icon';
                icon.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
                thumb.appendChild(icon);
                
                return thumb;
            }

            function renderGrid(videos) {
                grid.innerHTML = '';
                videos.forEach((video) => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    
                    const thumb = createThumbnail(video);
                    card.appendChild(thumb);
                    
                    const info = document.createElement('div');
                    info.className = 'video-info';
                    info.innerHTML = `
                        <h3>${video.title}</h3>
                        <p>${video.description}</p>
                    `;
                    card.appendChild(info);
                    
                    card.addEventListener('click', function() {
                        openVideo(video);
                    });
                    
                    grid.appendChild(card);
                });
            }

            function openVideo(video) {
                if (!playerPage) {
                    playerPage = createPlayerPage(video);
                    container.appendChild(playerPage);
                } else {
                    const wrapper = playerPage.querySelector('.player-wrapper');
                    let playerHtml = '';
                    if (video.isIframe) {
                        playerHtml = `<iframe src="${video.url}" allowfullscreen allow="autoplay; encrypted-media" frameborder="0"></iframe>`;
                    } else {
                        playerHtml = `<video controls autoplay><source src="${video.url}" type="video/mp4">Ваш браузер не поддерживает видео.</video>`;
                    }
                    wrapper.innerHTML = playerHtml;
                    
                    playerPage.querySelector('.video-detail-title').textContent = video.title;
                    playerPage.querySelector('.video-detail-desc').textContent = video.description;
                }
                grid.classList.add('hidden');
                playerPage.classList.add('active');
                const backLink = playerPage.querySelector('.back-link');
                backLink.onclick = function() {
                    closePlayer();
                };
            }

            function closePlayer() {
                if (playerPage) {
                    playerPage.classList.remove('active');
                    const wrapper = playerPage.querySelector('.player-wrapper');
                    const video = wrapper.querySelector('video');
                    if (video) {
                        video.pause();
                        video.currentTime = 0;
                    }
                    const iframe = wrapper.querySelector('iframe');
                    if (iframe) {
                        iframe.src = iframe.src;
                    }
                }
                grid.classList.remove('hidden');
            }

            renderGrid(videoData);
        });
    </script>
</body>
</html>
